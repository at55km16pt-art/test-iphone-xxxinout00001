<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ボイス翻訳トーク</title>
  <style>
    :root {
      --primary-color: #007aff;
      --bg-color: #f2f2f7;
      --card-bg: #ffffff;
      --text-color: #1c1c1e;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      box-sizing: border-box;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 20px;
      margin: 0;
    }
    .icon-btn {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      padding: 8px;
    }
    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .card-title {
      font-size: 12px;
      font-weight: bold;
      color: #8e8e93;
      margin-bottom: 8px;
    }
    .text-box {
      width: 100%;
      height: 90px;
      border: none;
      resize: none;
      font-size: 16px;
      box-sizing: border-box;
      outline: none;
      background: transparent;
      font-family: inherit;
    }
    .controls {
      display: flex;
      gap: 12px;
      margin-top: auto;
      padding-bottom: 16px;
    }
    .btn {
      flex: 1;
      padding: 18px;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    .btn-mic {
      background-color: #e5f1ff;
      color: var(--primary-color);
    }
    .btn-mic.recording {
      background-color: #ff3b30;
      color: white;
      animation: pulse 1.5s infinite;
    }
    .btn-speak {
      background-color: #34c759;
      color: white;
    }
    .btn-speak:disabled {
      background-color: #c7c7cc;
    }
    select {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #d1d1d6;
      background: white;
      font-size: 14px;
      margin-bottom: 16px;
    }
    
    /* モーダル画面（設定・履歴用） */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-content {
      background: white;
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 400px;
      max-height: 80vh;
      overflow-y: auto;
    }
    .input-group {
      margin-bottom: 12px;
    }
    .input-group label {
      display: block;
      font-size: 12px;
      color: #8e8e93;
      margin-bottom: 4px;
    }
    .input-group input {
      width: 100%;
      padding: 10px;
      border: 1px solid #d1d1d6;
      border-radius: 8px;
      box-sizing: border-box;
    }
    .history-item {
      border-bottom: 1px solid #e5e5ea;
      padding: 10px 0;
    }
    .history-ja { font-weight: bold; font-size: 14px; }
    .history-en { color: #555; font-size: 14px; margin-top: 4px; }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.6; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>

  <header>
    <h1>ボイス翻訳トーク</h1>
    <div>
      <button class="icon-btn" onclick="openModal('historyModal')">📜</button>
      <button class="icon-btn" onclick="openModal('settingsModal')">⚙️️</button>
    </div>
  </header>

  <!-- 2) 日本語表示 -->
  <div class="card">
    <div class="card-title">日本語 (認識結果)</div>
    <textarea id="txtJapanese" class="text-box" placeholder="「話す」ボタンを押しながら話してください..."></textarea>
  </div>

  <!-- 3) 英語表示 -->
  <div class="card">
    <div class="card-title">英語 (翻訳結果)</div>
    <textarea id="txtEnglish" class="text-box" placeholder="翻訳された英語がここに表示されます..."></textarea>
  </div>

  <!-- ボイスモデル選択 -->
  <label class="card-title" style="margin-left: 4px;">発話ボイスを選択</label>
  <select id="voiceSelect">
    <option value="pNInz6obpgDQGcFmaJgB">Adam (男性・標準英語)</option>
    <option value="21m00Tcm4TlvDq8ikWAM">Rachel (女性・標準英語)</option>
  </select>

  <!-- 1) & 4) ボタンエリア -->
  <div class="controls">
    <button id="btnTalk" class="btn btn-mic">
      <span>🎤</span> <span id="talkLabel">話す (長押し)</span>
    </button>
    <button id="btnSpeak" class="btn btn-speak" onclick="speakEnglish()">
      <span>🔊</span> 英語トーク
    </button>
  </div>

  <!-- ⚙️ APIキー設定モーダル -->
  <div id="settingsModal" class="modal">
    <div class="modal-content">
      <h3>APIキー・設定</h3>
      <div class="input-group">
        <label>OpenAI API Key</label>
        <input type="password" id="openaiKey" placeholder="sk-...">
      </div>
      <div class="input-group">
        <label>ElevenLabs API Key</label>
        <input type="password" id="elevenlabsKey" placeholder="sk_...">
      </div>
      <div class="input-group">
        <label>カスタム Voice ID (自分の声を使う場合)</label>
        <input type="text" id="customVoiceId" placeholder="Voice ID を入力">
      </div>
      <button class="btn btn-speak" style="width: 100%; margin-top: 12px;" onclick="saveSettings()">設定を保存</button>
    </div>
  </div>

  <!-- 📜 履歴モーダル -->
  <div id="historyModal" class="modal">
    <div class="modal-content">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h3>翻訳履歴</h3>
        <button class="icon-btn" onclick="closeModal('historyModal')">✖</button>
      </div>
      <div id="historyList"></div>
    </div>
  </div>

  <script>
    let mediaRecorder;
    let audioChunks = [];
    let historyData = JSON.parse(localStorage.getItem('translateHistory') || '[]');

    // 画面初期化時に設定を読み込む
    window.onload = () => {
      document.getElementById('openaiKey').value = localStorage.getItem('openai_key') || '';
      document.getElementById('elevenlabsKey').value = localStorage.getItem('elevenlabs_key') || '';
      document.getElementById('customVoiceId').value = localStorage.getItem('custom_voice_id') || '';

      const customId = localStorage.getItem('custom_voice_id');
      if (customId) {
        const select = document.getElementById('voiceSelect');
        const opt = document.createElement('option');
        opt.value = customId;
        opt.text = "自分の英語ボイスモデル (カスタム)";
        opt.selected = true;
        select.add(opt, 0);
      }
      renderHistory();
    };

    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    function saveSettings() {
      localStorage.setItem('openai_key', document.getElementById('openaiKey').value.trim());
      localStorage.setItem('elevenlabs_key', document.getElementById('elevenlabsKey').value.trim());
      localStorage.setItem('custom_voice_id', document.getElementById('customVoiceId').value.trim());
      alert('設定を保存しました');
      closeModal('settingsModal');
      location.reload();
    }

    // --- 1) マイク録音 (iPhone タッチ/長押し対応) ---
    const btnTalk = document.getElementById('btnTalk');
    
    const startRecording = async (e) => {
      e.preventDefault();
      audioChunks = [];
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        mediaRecorder.ondataavailable = event => audioChunks.push(event.data);
        mediaRecorder.onstop = processAudio;
        mediaRecorder.start();
        
        btnTalk.classList.add('recording');
        document.getElementById('talkLabel').innerText = '録音中... (離すと完了)';
      } catch (err) {
        alert('マイクへのアクセス許可が必要です: ' + err.message);
      }
    };

    const stopRecording = (e) => {
      e.preventDefault();
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
        btnTalk.classList.remove('recording');
        document.getElementById('talkLabel').innerText = '話す (長押し)';
      }
    };

    // iPhone (Touch) & PC (Mouse) 両対応のイベント設定
    btnTalk.addEventListener('touchstart', startRecording);
    btnTalk.addEventListener('touchend', stopRecording);
    btnTalk.addEventListener('mousedown', startRecording);
    btnTalk.addEventListener('mouseup', stopRecording);

    // --- 2) & 3) 音声認識 (Whisper) と 翻訳 (ChatGPT) ---
    async function processAudio() {
      const apiKey = localStorage.getItem('openai_key');
      if (!apiKey) {
        alert('⚙️ 設定ボタンから OpenAI API Key を入力してください');
        openModal('settingsModal');
        return;
      }

      const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
      const formData = new FormData();
      formData.append('file', audioBlob, 'recording.wav');
      formData.append('model', 'whisper-1');
      formData.append('language', 'ja');

      document.getElementById('txtJapanese').value = "音声認識中...";

      try {
        // 2) 音声認識
        const sttRes = await fetch('https://api.openai.com/v1/audio/transcriptions', {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${apiKey}` },
          body: formData
        });
        const sttData = await sttRes.json();
        const jaText = sttData.text || '';
        document.getElementById('txtJapanese').value = jaText;

        if (!jaText) return;

        document.getElementById('txtEnglish').value = "翻訳中...";

        // 3) 英語翻訳
        const transRes = await fetch('https://api.openai.com/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${apiKey}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            model: "gpt-4o-mini",
            messages: [
              { role: "system", content: "Translate the following Japanese text into natural spoken English." },
              { role: "user", content: jaText }
            ]
          })
        });
        const transData = await transRes.json();
        const enText = transData.choices[0].message.content.trim();
        document.getElementById('txtEnglish').value = enText;

        // 5) 履歴保存
        historyData.unshift({ ja: jaText, en: enText });
        localStorage.setItem('translateHistory', JSON.stringify(historyData));
        renderHistory();

      } catch (err) {
        alert('エラーが発生しました: ' + err.message);
      }
    }

    // --- 4) 英語トーク (ElevenLabs 音声再生) ---
    async function speakEnglish() {
      const apiKey = localStorage.getItem('elevenlabs_key');
      const enText = document.getElementById('txtEnglish').value.trim();
      const voiceId = document.getElementById('voiceSelect').value;

      if (!apiKey) {
        alert('⚙️ 設定ボタンから ElevenLabs API Key を入力してください');
        openModal('settingsModal');
        return;
      }
      if (!enText) {
        alert('発話する英語テキストがありません');
        return;
      }

      try {
        const response = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${voiceId}`, {
          method: 'POST',
          headers: {
            'Accept': 'audio/mpeg',
            'xi-api-key': apiKey,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            text: enText,
            model_id: "eleven_multilingual_v2"
          })
        });

        if (!response.ok) throw new Error('音声生成に失敗しました');

        const audioBlob = await response.blob();
        const audioUrl = URL.createObjectURL(audioBlob);
        const audio = new Audio(audioUrl);
        audio.play();

      } catch (err) {
        alert('音声再生エラー: ' + err.message);
      }
    }

    // --- 5) 履歴表示 ---
    function renderHistory() {
      const list = document.getElementById('historyList');
      list.innerHTML = '';
      historyData.forEach(item => {
        const div = document.createElement('div');
        div.className = 'history-item';
        div.innerHTML = `<div class="history-ja">JP: ${item.ja}</div><div class="history-en">EN: ${item.en}</div>`;
        list.appendChild(div);
      });
    }
  </script>
</body>
</html>
