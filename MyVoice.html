<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ボイス翻訳トーク (Gemini版)</title>
  <style>
    :root {
      --primary-color: #007aff;
      --bg-color: #f2f2f7;
      --card-bg: #ffffff;
      --text-color: #1c1c1e;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      box-sizing: border-box;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    h1 { font-size: 20px; margin: 0; }
    .icon-btn {
      background: none; border: none; font-size: 20px; cursor: pointer; padding: 8px;
    }
    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .card-title { font-size: 12px; font-weight: bold; color: #8e8e93; margin-bottom: 8px; }
    .text-box {
      width: 100%; height: 90px; border: none; resize: none; font-size: 16px;
      box-sizing: border-box; outline: none; background: transparent; font-family: inherit;
    }
    .controls {
      display: flex; gap: 12px; margin-top: auto; padding-bottom: 16px;
    }
    .btn {
      flex: 1; padding: 18px; border: none; border-radius: 14px; font-size: 16px;
      font-weight: bold; cursor: pointer; display: flex; align-items: center;
      justify-content: center; gap: 8px; user-select: none; touch-action: manipulation;
    }
    .btn-mic { background-color: #e5f1ff; color: var(--primary-color); }
    .btn-mic.recording { background-color: #ff3b30; color: white; animation: pulse 1.5s infinite; }
    .btn-speak { background-color: #34c759; color: white; }
    
    .modal {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5); z-index: 100; align-items: center; justify-content: center; padding: 20px;
    }
    .modal-content {
      background: white; border-radius: 16px; padding: 20px; width: 100%; max-width: 400px; max-height: 80vh; overflow-y: auto;
    }
    .input-group { margin-bottom: 12px; }
    .input-group label { display: block; font-size: 12px; color: #8e8e93; margin-bottom: 4px; }
    .input-group input { width: 100%; padding: 10px; border: 1px solid #d1d1d6; border-radius: 8px; box-sizing: border-box; }
    .history-item { border-bottom: 1px solid #e5e5ea; padding: 10px 0; }
    .history-ja { font-weight: bold; font-size: 14px; }
    .history-en { color: #555; font-size: 14px; margin-top: 4px; }

    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
  </style>
</head>
<body>

  <header>
    <h1>ボイス翻訳トーク (Gemini)</h1>
    <div>
      <button class="icon-btn" onclick="openModal('historyModal')">📜</button>
      <button class="icon-btn" onclick="openModal('settingsModal')">⚙</button>
    </div>
  </header>

  <!-- 日本語表示画面 -->
  <div class="card">
    <div class="card-title">日本語 (認識結果)</div>
    <textarea id="txtJapanese" class="text-box" placeholder="「話す」ボタンを押しながら話してください..."></textarea>
  </div>

  <!-- 英語表示画面 -->
  <div class="card">
    <div class="card-title">英語 (翻訳結果)</div>
    <textarea id="txtEnglish" class="text-box" placeholder="翻訳された英語がここに表示されます..."></textarea>
  </div>

  <!-- ボタンエリア -->
  <div class="controls">
    <button id="btnTalk" class="btn btn-mic">
      <span>🎤</span> <span id="talkLabel">話す (長押し)</span>
    </button>
    <button id="btnSpeak" class="btn btn-speak" onclick="speakEnglish()">
      <span>🔊</span> 英語トーク
    </button>
  </div>

  <!-- 設定画面 -->
  <div id="settingsModal" class="modal">
    <div class="modal-content">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h3>Gemini API設定</h3>
        <button class="icon-btn" onclick="closeModal('settingsModal')">✖</button>
      </div>
      <div class="input-group">
        <label>Gemini API Key</label>
        <input type="password" id="geminiKey" placeholder="AIzaSy...">
      </div>
      <button class="btn btn-speak" style="width: 100%; margin-top: 12px;" onclick="saveSettings()">設定を保存</button>
    </div>
  </div>

  <!-- 履歴表示画面 -->
  <div id="historyModal" class="modal">
    <div class="modal-content">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h3>翻訳履歴</h3>
        <button class="icon-btn" onclick="closeModal('historyModal')">✖</button>
      </div>
      <div id="historyList"></div>
    </div>
  </div>

  <script>
    // ★ ここにご自身の Gemini API Key を設定すると最初から設定なしで動きます
    const DEFAULT_GEMINI_KEY = "your_gemini_api_key_here";

    let mediaRecorder;
    let audioChunks = [];
    let historyData = JSON.parse(localStorage.getItem('translateHistory') || '[]');

    window.onload = () => {
      const savedKey = localStorage.getItem('gemini_key');
      if (!savedKey && DEFAULT_GEMINI_KEY !== "your_gemini_api_key_here") {
        localStorage.setItem('gemini_key', DEFAULT_GEMINI_KEY);
      }
      document.getElementById('geminiKey').value = getGeminiKey();
      renderHistory();
    };

    function getGeminiKey() {
      return localStorage.getItem('gemini_key') || DEFAULT_GEMINI_KEY;
    }

    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    function saveSettings() {
      localStorage.setItem('gemini_key', document.getElementById('geminiKey').value.trim());
      alert('Gemini API Key を保存しました');
      closeModal('settingsModal');
      location.reload();
    }

    // --- 1) マイク録音 (長押し) ---
    const btnTalk = document.getElementById('btnTalk');
    
    const startRecording = async (e) => {
      e.preventDefault();
      audioChunks = [];
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        mediaRecorder.ondataavailable = event => audioChunks.push(event.data);
        mediaRecorder.onstop = processAudioWithGemini;
        mediaRecorder.start();
        
        btnTalk.classList.add('recording');
        document.getElementById('talkLabel').innerText = '録音中... (離すと完了)';
      } catch (err) {
        alert('マイク許可が必要です: ' + err.message);
      }
    };

    const stopRecording = (e) => {
      e.preventDefault();
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
        btnTalk.classList.remove('recording');
        document.getElementById('talkLabel').innerText = '話す (長押し)';
      }
    };

    btnTalk.addEventListener('touchstart', startRecording);
    btnTalk.addEventListener('touchend', stopRecording);
    btnTalk.addEventListener('mousedown', startRecording);
    btnTalk.addEventListener('mouseup', stopRecording);

    // --- 2) Gemini で「音声認識＋日本語表示＋英語翻訳」を一括処理 ---
    async function processAudioWithGemini() {
      const apiKey = getGeminiKey();
      if (!apiKey || apiKey === "your_gemini_api_key_here") {
        alert('Gemini API Key を設定してください。');
        openModal('settingsModal');
        return;
      }

      document.getElementById('txtJapanese').value = "Geminiで音声解析中...";
      document.getElementById('txtEnglish').value = "翻訳中...";

      const audioBlob = new Blob(audioChunks, { type: 'audio/mp3' });
      const reader = new FileReader();
      
      reader.readAsDataURL(audioBlob);
      reader.onloadend = async () => {
        const base64Audio = reader.result.split(',')[1];

        try {
          // Gemini 1.5 Flash に音声ファイルを直接渡して認識と翻訳を要求
          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{
                parts: [
                  { inline_data: { mime_type: "audio/mp3", data: base64Audio } },
                  { text: "入力された日本語音声を文字起こしし、さらに自然な会話表現の英語に翻訳してください。出力は必ず次のJSON形式のみで返してください: {\"ja\": \"日本語の文字起こし\", \"en\": \"英語翻訳\"}" }
                ]
              }]
            })
          });

          const data = await response.json();
          const rawText = data.candidates[0].content.parts[0].text;
          
          // クリーンなJSONに整形してパース
          const jsonMatch = rawText.match(/\{[\s\S]*\}/);
          if (jsonMatch) {
            const parsed = JSON.parse(jsonMatch[0]);
            document.getElementById('txtJapanese').value = parsed.ja || '';
            document.getElementById('txtEnglish').value = parsed.en || '';

            // 履歴追加
            historyData.unshift({ ja: parsed.ja, en: parsed.en });
            localStorage.setItem('translateHistory', JSON.stringify(historyData));
            renderHistory();
          } else {
            document.getElementById('txtJapanese').value = rawText;
          }

        } catch (err) {
          alert('Gemini API エラー: ' + err.message);
        }
      };
    }

    // --- 3) 英語トーク (標準TTS読み上げ) ---
    function speakEnglish() {
      const enText = document.getElementById('txtEnglish').value.trim();
      if (!enText) {
        alert('発話する英語テキストがありません');
        return;
      }

      // ブラウザ標準（Web Speech API）による自然な英語音声読み上げ
      const utterance = new SpeechSynthesisUtterance(enText);
      utterance.lang = 'en-US';
      utterance.rate = 1.0;
      window.speechSynthesis.speak(utterance);
    }

    // --- 履歴表示 ---
    function renderHistory() {
      const list = document.getElementById('historyList');
      list.innerHTML = '';
      historyData.forEach(item => {
        const div = document.createElement('div');
        div.className = 'history-item';
        div.innerHTML = `<div class="history-ja">JP: ${item.ja}</div><div class="history-en">EN: ${item.en}</div>`;
        list.appendChild(div);
      });
    }
  </script>
</body>
</html>
