<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPhone AR Viewer</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f5f5f7;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: #ffffff;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .file-label {
            display: block;
            padding: 14px 20px;
            background: #0071e3;
            color: #ffffff;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 12px;
            font-size: 15px;
        }
        input[type="file"] {
            display: none;
        }
        .ar-button {
            display: none; /* ファイル選択後に表示 */
            padding: 16px 24px;
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
            background-color: #34c759;
            border-radius: 12px;
            text-decoration: none;
            box-shadow: 0 4px 12px rgba(52, 199, 89, 0.3);
            margin-top: 15px;
        }
        .file-info {
            font-size: 13px;
            color: #86868b;
            margin-top: 8px;
            word-break: break-all;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>板金 3D/AR Viewer</h2>
    
    <!-- 1. USDZ ファイル選択ボタン -->
    <label for="usdz-input" class="file-label">
        📂 USDZ ファイルを参照・選択
    </label>
    <input type="file" id="usdz-input" accept=".usdz">

    <div id="file-info" class="file-info">USDZファイルを選択してください</div>

    <!-- 2. Apple Quick Look 起動リンク -->
    <a id="ar-link" rel="ar" href="#" class="ar-button">
        📱 カメラで AR 表示（実寸大）
    </a>
</div>

<script>
    const fileInput = document.getElementById('usdz-input');
    const arLink = document.getElementById('ar-link');
    const fileInfo = document.getElementById('file-info');

    fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        
        if (file) {
            fileInfo.textContent = `選択中: ${file.name}`;
            
            // 選択されたローカルUSDZを Blob URL 形式へ変換して Quick Look リンクにセット
            const objectURL = URL.createObjectURL(file);
            arLink.href = objectURL;
            arLink.style.display = 'inline-block';
        } else {
            arLink.style.display = 'none';
            fileInfo.textContent = 'USDZファイルを選択してください';
        }
    });
</script>

</body>
</html>
